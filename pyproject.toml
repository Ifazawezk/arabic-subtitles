[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arsub"
version = "0.1.0"
description = "Arabic subtitles for any video or audio file, offline on your own GPU or CPU."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohaned Elhagar" }]
keywords = ["arabic", "subtitles", "whisper", "faster-whisper", "speech-recognition", "srt", "rtl", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1",
    "av>=11,<19",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Ifazawezk/arabic-subtitles"
Issues = "https://github.com/Ifazawezk/arabic-subtitles/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arsub = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
